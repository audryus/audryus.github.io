<!doctype html>
<html lang="pt" id="html-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Audryus Leite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    /* Language toggle button */
    body {
      position: relative;
    }
    
    .language-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1000;
      display: flex;
      gap: 0.5rem;
      background: transparent;
    }
    
    .lang-btn {
      padding: 0.5rem 1rem;
      border: 2px solid #ff6d1f;
      background: white;
      color: #ff6d1f;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }
    
    .lang-btn.active {
      background: #ff6d1f;
      color: white;
    }
    
    .lang-btn:hover {
      opacity: 0.8;
    }
    
    @media (prefers-color-scheme: dark) {
      .lang-btn {
        background: #18181b;
        color: #fb923c;
        border-color: #fb923c;
      }
      
      .lang-btn.active {
        background: #fb923c;
        color: #18181b;
      }
    }
    
    #content-container {
      min-height: 100vh;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 50vh;
      font-size: 1.2rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="language-toggle">
    <button class="lang-btn active" data-lang="pt" id="btn-pt">🇧🇷 PT</button>
    <button class="lang-btn" data-lang="en" id="btn-en">🇺🇸 EN</button>
  </div>
  
  <div id="content-container"></div>

  <script>
    const CACHE_KEY = 'resume_language';
    const contentContainer = document.getElementById('content-container');
    const htmlRoot = document.getElementById('html-root');
    const btnPt = document.getElementById('btn-pt');
    const btnEn = document.getElementById('btn-en');

    // Detectar idioma salvo ou usar padrão (português)
    function getSavedLanguage() {
      const saved = localStorage.getItem(CACHE_KEY);
      if (saved && ['pt', 'en'].includes(saved)) {
        return saved;
      }
      // Detectar idioma do navegador
      const browserLang = navigator.language || navigator.userLanguage;
      return browserLang.startsWith('en') ? 'en' : 'pt';
    }

    // Carregar conteúdo do arquivo HTML
    async function loadLanguage(lang) {
      const file = lang === 'en' ? 'resume-en.html' : 'resume-pt.html';
      
      contentContainer.innerHTML = '<div class="loading">Carregando...</div>';
      
      try {
        const response = await fetch(file);
        if (!response.ok) throw new Error(`Erro ao carregar ${file}`);
        
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        // Extrair apenas o conteúdo do <body>
        const bodyContent = doc.body;
        
        // Limpar e adicionar novo conteúdo
        contentContainer.innerHTML = '';
        while (bodyContent.firstChild) {
          contentContainer.appendChild(bodyContent.firstChild);
        }
        
        // Copiar estilos da <head>
        const styles = doc.head.querySelectorAll('style, link[rel="stylesheet"]');
        styles.forEach(style => {
          if (!document.head.querySelector(`[data-source="${file}"]`)) {
            const clone = style.cloneNode(true);
            clone.setAttribute('data-source', file);
            document.head.appendChild(clone);
          }
        });
        
        // Atualizar idioma do HTML
        htmlRoot.lang = lang;
        
        // Atualizar botões
        document.querySelectorAll('.lang-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.lang === lang);
        });
        
        // Salvar preferência
        localStorage.setItem(CACHE_KEY, lang);
        
      } catch (error) {
        console.error('Erro:', error);
        contentContainer.innerHTML = '<div class="loading">Erro ao carregar o conteúdo. Tente novamente.</div>';
      }
    }

    // Event listeners dos botões
    btnPt.addEventListener('click', () => loadLanguage('pt'));
    btnEn.addEventListener('click', () => loadLanguage('en'));

    // Carregar idioma salvo ao inicializar
    const initialLang = getSavedLanguage();
    loadLanguage(initialLang);
  </script>
</body>
</html>
